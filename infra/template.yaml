AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Tax Calculator AWS SAM Application"

Parameters:
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key for the agent

Globals: 
  Function: 
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128
    Architectures: 
      - x86_64

  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowMethods: "'*'"
      AllowHeaders: "'*'"

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src
      Handler: handlers.health.lambda_handler
      Events:
        HealthApi:
          Type: Api
          Properties: 
            Path: /health
            Method: get

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties: 
      CodeUri: ../backend/src
      Handler: handlers.processor.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          TAX_CATEGORIES_TABLE: !Ref TaxCategoriesTable
          INVOICES_TABLE: !Ref InvoicesTable
          OPENAI_API_KEY: !Ref OpenAiApiKey
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-invoices-${AWS::AccountId}"
        - DynamoDBReadPolicy:
            TableName: !Ref TaxCategoriesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InvoicesTable
      Events:
        InvoiceUploaded:
          Type: S3
          Properties:
            Bucket: !Ref InvoiceBucket
            Events: s3:ObjectCreated:*

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src
      Handler: handlers.api.lambda_handler
      Environment:
        Variables:
          INVOICES_TABLE: !Ref InvoicesTable
          INVOICE_BUCKET: !Sub "${AWS::StackName}-invoices-${AWS::AccountId}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-invoices-${AWS::AccountId}"
      Events:
        CreateUpload:
          Type: Api
          Properties:
            Path: /uploads
            Method: post
        ListInvoices:
          Type: Api
          Properties:
            Path: /invoices
            Method: get
        GetInvoice:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}
            Method: get

  InvoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-invoices-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
            - "*"
          AllowedMethods:
            - PUT
          AllowedHeaders:
            - "*"

  TaxCategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: 
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: category
          KeyType: HASH

  InvoicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: invoiceId
          AttributeType: S
      KeySchema:
        - AttributeName: invoiceId
          KeyType: HASH
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
          Name: !Sub "${AWS::StackName}-front-end-oac"
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement: 
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution.Id}"

Outputs:
  HealthUrl:
    Description: Invoke URL for the health check
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/health

  ApiUrl:
    Description: Invoke URL for the api check
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod

  FrontendUrl:
    Description: CloudFront URL for the frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  InvoiceBucketName:
    Description: Referencing Invoice Bucket
    Value: !Ref InvoiceBucket

  TaxCategoriesTableName:
    Description: Table for tax categories
    Value: !Ref TaxCategoriesTable

  InvoicesTableName:
    Description: Invoices Table
    Value: !Ref InvoicesTable
  


