AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Tax Calculator AWS SAM Application"

Parameters:
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key for the agent

Globals: 
  Function: 
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128
    Architectures: 
      - x86_64

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src
      Handler: handlers.health.lambda_handler
      Events:
        HealthApi:
          Type: Api
          Properties: 
            Path: /health
            Method: get

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties: 
      CodeUri: ../backend/src
      Handler: handlers.processor.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          TAX_CATEGORIES_TABLE: !Ref TaxCategoriesTable
          INVOICES_TABLE: !Ref InvoicesTable
          OPENAI_API_KEY: !Ref OpenAiApiKey
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-invoices-${AWS::AccountId}"
        - DynamoDBReadPolicy:
            TableName: !Ref TaxCategoriesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TaxCategoriesTable
      Events:
        InvoiceUploaded:
          Type: S3
          Properties:
            Bucket: !Ref InvoiceBucket
            Events: s3:ObjectCreated:*

  InvoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-invoices-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  TaxCategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: 
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: category
          KeyType: HASH

  InvoicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: invoiceId
          AttributeType: S
      KeySchema:
        - AttributeName: invoiceId
          KeyType: HASH

Outputs:
  HealthUrl:
    Description: Invoke URL for the health check
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/health

  InvoiceBucketName:
    Description: Referencing Invoice Bucket
    Value: !Ref InvoiceBucket

  TaxCategoriesTableName:
    Description: Table for tax categories
    Value: !Ref TaxCategoriesTable

  InvoicesTableName:
    Description: Invoices Table
    Value: !Ref InvoicesTable
  


